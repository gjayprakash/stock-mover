name: Daily run

# 00:30 UTC = 06:00 IST. Free GitHub schedule instead of a paid Render cron job;
# the health call also wakes the free Render instance.
on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:

concurrency:
  group: daily-run
  cancel-in-progress: false

env:
  BASE: https://stock-mover.onrender.com

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Wake the service
        run: curl -sS --retry 5 --retry-delay 15 --retry-all-errors --max-time 90 "$BASE/api/health"

      - name: Start the run
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          # 409 = a run (e.g. the boot run) is already going; wait and retry.
          for i in 1 2 3 4 5 6; do
            code=$(curl -sS -o resp.json -w '%{http_code}' -XPOST -H "X-Cron-Secret: $CRON_SECRET" "$BASE/api/run")
            echo "POST /api/run -> $code $(cat resp.json)"
            if [ "$code" = 202 ]; then
              echo "RUN_ID=$(jq -r .run_id resp.json)" >> "$GITHUB_ENV"; exit 0
            fi
            [ "$code" = 409 ] || exit 1
            sleep 20
          done
          exit 1

      - name: Wait for it to finish
        run: |
          for i in $(seq 1 18); do
            status=$(curl -sS "$BASE/api/runs" | jq -r --arg id "$RUN_ID" '.[] | select(.run_id == $id) | .status')
            echo "$RUN_ID: ${status:-not found}"
            [ "$status" = FINISHED ] && exit 0
            [ "$status" = FAILED ] && { curl -sS "$BASE/api/runs" | jq --arg id "$RUN_ID" '.[] | select(.run_id == $id)'; exit 1; }
            sleep 10
          done
          echo "timed out after 3 min"; exit 1
