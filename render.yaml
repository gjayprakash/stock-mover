services:
  - type: web
    name: stock-mover
    runtime: node
    plan: free
    region: singapore
    branch: main
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        sync: false
      - key: CRON_SECRET
        sync: false
      - key: MESH_API_KEY
        sync: false
      - key: MESH_MODEL
        sync: false
      # Optional sign-in: off unless APP_USERS is set (see README).
      - key: APP_USERS
        sync: false
      - key: AUTH_SECRET
        sync: false
