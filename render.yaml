services:
  - type: web
    name: stock-mover
    runtime: node
    plan: free
    region: singapore
    branch: main
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        sync: false
      - key: CRON_SECRET
        sync: false
      - key: MESH_API_KEY
        sync: false
      - key: MESH_MODEL
        sync: false
      # "true" makes every /api route except @Public() ones need sign-in (#78 turns it on).
      - key: AUTH_REQUIRED
        sync: false
